name: SPARK Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark_proof:
    name: SPARK / GNATprove
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pinned Alire and Ada toolchain
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: "2.1.1"
          toolchain: "gnat_native=16.1.0 gprbuild=26.0.1"
          cache: true

      - name: Test strict report gate
        run: python3 -m unittest -v tests/ci/test_spark_report.py

      - name: Verify native checks-as-errors behavior
        run: scripts/ci/test_native_checks_as_errors.sh

      - name: Run complete SPARK analysis and gate results
        id: proof
        run: python3 scripts/ci/spark_report.py run --artifact-dir artifacts/spark

      - name: Publish native GNATprove SARIF
        id: sarif_upload
        if: ${{ always() && !cancelled() && steps.proof.outputs.sarif_valid == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: artifacts/spark/gnatprove-upload.sarif
          checkout_path: ${{ github.workspace }}
          category: spark-gnatprove
          wait-for-processing: true

      - name: Finalize SPARK report
        if: ${{ always() }}
        shell: bash
        env:
          SARIF_VALID: ${{ steps.proof.outputs.sarif_valid }}
          UPLOAD_OUTCOME: ${{ steps.sarif_upload.outcome }}
        run: |
          mkdir -p artifacts/spark
          python3 scripts/ci/spark_report.py finalize \
            --artifact-dir artifacts/spark \
            --sarif-valid "$SARIF_VALID" \
            --upload-outcome "$UPLOAD_OUTCOME"

      - name: Ensure final report exists
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -x scripts/ci/ensure_summary.sh ]]; then
            scripts/ci/ensure_summary.sh artifacts/spark
          elif [[ ! -f artifacts/spark/summary.md ]]; then
            mkdir -p artifacts/spark
            printf '%s\n' \
              '# SPARK Verification' '' \
              '**Overall result: FAIL**' '' \
              '- Proof: **FAIL — proof not completed**' '' \
              'Checkout failed before repository reporting code was available.' \
              'Missing analysis is not treated as zero failures.' \
              > artifacts/spark/summary.md
          fi

      - name: Publish authoritative SPARK summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f scripts/ci/spark_report.py ]]; then
            python3 scripts/ci/spark_report.py publish --artifact-dir artifacts/spark
          else
            cat artifacts/spark/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SPARK evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spark-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/spark/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Ada / Build
    needs: spark_proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pinned Alire and Ada toolchain
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: "2.1.1"
          toolchain: "gnat_native=16.1.0 gprbuild=26.0.1"
          cache: true

      - name: Build library
        run: alr -n build
